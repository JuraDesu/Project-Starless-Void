name: Build and deploy game

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EMSDK: ${{ github.workspace }}/.toolchains/emsdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: .toolchains/emsdk
          key: emsdk-4.0.14-linux

      - name: Set up Emscripten
        run: |
          chmod +x setup_emsdk.sh build.sh
          ./setup_emsdk.sh "$EMSDK"

      - name: Build game deployment
        run: ./build.sh client

      - name: Validate deployment
        run: |
          test -f out/index.html
          test -f out/index.js
          test -f out/index.wasm
          test -f out/content.wmod
          touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
